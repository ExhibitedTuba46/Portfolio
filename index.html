<!DOCTYPE html>
<!--Type "!" then press tab for html skeleton-->

<html>

<head>
    <!--This is the title at the top of the website-->
    <title>Tutorial Website</title>
</head>

<body>

    <!--Header, 1 to 6-->
    <h1>This is a crazy header</h1>
    <!--Horizontal Break-->
    <hr>

    <h6>Another crazy header</h6>
    <!--Line Break-->
    <br>

    <!--Paragraph tags, line space added above and below-->
    <p>This is a really cool paragraph about how awesome this website is</p>

    <!--Hyperlinks-->
    <!--_blank for new tab, _self for same window-->
    <a href="page2.html" target=_self title="This takes you to Page 2">
        Go To Page 2
    </a>
    <br>

    <a href="https://www.google.com" target=_self title="This takes you to Google">
        Google
    </a>
    <br>

    <a href="mailto:jaketofts@outlook.com" target=_self title="This takes you to my email">
        Email me
    </a>
    <br>

    <!--Images-->
    <!--Width and height can be changed seperately, can also scale proportionaly-->
    <!--Alt is for text to speech for images-->
    <h3>Zote The Mighty:</h3>
    <a href="https://hollowknight.fandom.com/wiki/Zote">
    <img src="/images/ZoteTheMighty.png" height="250" alt="This is a picture of Zote The Mighty" title="Zote The Mighty">
    </a>
    <p>He's so mighty</p>
    
    <!--Audio-->
    <!--autoplay to play automatically-->
    <!--muted to mute-->
    <!--If no backup audio files are needed then type src="filepath" into parameters-->
    <audio controls loop>
        <!--18:21-->
    </audio>
</body>

</html>
